[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

# Deploy.s.sol reads presets and writes deployed addresses
fs_permissions = [
  { access = "read", path = "../environments" },
  { access = "read-write", path = "../config" },
]

[lint]
lint_on_build = false

[invariant]
fail_on_revert = true
runs = 256
depth = 500
